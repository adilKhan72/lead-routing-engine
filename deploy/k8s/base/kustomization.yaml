apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: lead-routing-engine
    includeSelectors: false
    # Pod templates need the label too: the default-deny NetworkPolicy selects pods by it.
    includeTemplates: true
resources:
  - configmap.yaml
  - ingest.yaml
  - router.yaml
  - networkpolicy.yaml
images:
  - name: lead-routing-engine
    newTag: latest
