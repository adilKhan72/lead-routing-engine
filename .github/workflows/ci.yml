name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests (Postgres 18 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lre
          POSTGRES_PASSWORD: lre
          POSTGRES_DB: lre_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lre -d lre_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://lre:lre@localhost:5432/lre_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  image:
    name: Compose end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Compose smoke test (ingest -> stream -> router -> sold)
        run: |
          docker compose up -d --build ingest router
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/readyz
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U lre lre < db/seed/demo-buyers.sql
          lead=$(curl -fsS -X POST http://127.0.0.1:3000/v1/leads \
            -H 'content-type: application/json' -H 'idempotency-key: ci-smoke-0001' \
            -d '{"product":"personal_loan","state":"TX","zip":"73301","amountCents":1500000,"creditBand":"good","contact":{"firstName":"Ci","lastName":"Smoke","email":"ci@example.com","phone":"+15555550123"},"consent":{"tcpa":true,"capturedAt":"2026-10-15T10:00:00Z"},"source":{"publisherId":"ci"}}' \
            | jq -r .leadId)
          # Buyers are simulated with random behaviour, so assert the lead reached a final state, not who bought it.
          for i in $(seq 1 30); do
            status=$(curl -fsS "http://127.0.0.1:3000/v1/leads/$lead" | jq -r .status)
            echo "lead $lead: $status"
            case "$status" in sold|unsold) break ;; esac
            sleep 1
          done
          case "$status" in sold|unsold) ;; *) exit 1 ;; esac
          docker compose exec -T postgres psql -U lre lre -c \
            "SELECT outcome, price_cents, latency_ms, decided_by, jsonb_pretty(attempts) FROM routing_decisions"
          docker compose exec -T router wget -qO- http://127.0.0.1:9100/metrics | grep -E '^lre_(routing|buyer)' | head -20 || true
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  k8s-validate:
    name: Kubernetes manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar -xz -C /usr/local/bin kustomize
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform
      - name: Build and validate every overlay (CRDs such as KEDA's ScaledObject via the datree catalog)
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::$overlay"
            kustomize build "$overlay" | kubeconform -strict -summary -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

  k8s-smoke:
    name: Kubernetes smoke test (kind)
    needs: k8s-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: lre
      - name: Build image and load it into kind
        run: |
          docker build -t lead-routing-engine:latest .
          kind load docker-image lead-routing-engine:latest --name lre
      - name: Deploy demo overlay and route a lead end to end
        run: scripts/k8s-smoke.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n lre-demo get pods -o wide
          kubectl -n lre-demo describe pods | tail -80
          kubectl -n lre-demo logs deployment/ingest --all-containers --tail=80 || true
          kubectl -n lre-demo logs deployment/router --all-containers --tail=80 || true
